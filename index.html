<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mara's Abyss</title>
<meta name="description" content="Mara's Abyss — an as of yet unlicensed game for Game Boy Color and ModRetro Chromatic.">

<!-- A single self-contained page: the styles are inline because there is no
     second page at this level to share them with, and the only asset is the
     skull, which lives with the demo. Bump ?v= on its URL when it changes.

     This file is what puts a real page at the root. Static assets are matched
     before the Worker runs, so its mere existence overrides the Worker's
     redirect to /frienddemo. -->
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --text: #e7ecf5;
  --muted: #96a0b5;
  --accent: #7dd3a0;
  --hazard: #e8b23a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  min-height: 100vh;
  padding: 48px 20px;
  text-align: center;
}

/* goodskull.gif has no alpha and its palette index 0 is #000000, so it only
   sits cleanly on a page whose background is exactly black. */
.skulls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.skulls img {
  width: 96px;
  height: 96px;
  image-rendering: pixelated;
}

.skulls img:nth-child(2) { width: 132px; height: 132px; }
.skulls img:nth-child(3) { transform: scaleX(-1); }

h1 {
  margin: 0;
  font-size: clamp(30px, 9vw, 54px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.1;
}

.tagline {
  margin: 0;
  max-width: 30ch;
  color: var(--muted);
  font-size: clamp(14px, 3.4vw, 17px);
  text-wrap: balance;
}

.tagline strong { color: var(--text); font-weight: 600; }

/* Hazard stripes, drawn rather than fetched — no second image to load. */
.construction {
  position: relative;
  width: min(100%, 460px);
  padding: 14px 0;
  border-top: 2px solid var(--hazard);
  border-bottom: 2px solid var(--hazard);
  background: repeating-linear-gradient(
      -45deg, var(--hazard) 0 14px, #000 14px 28px);
}

.construction span {
  display: inline-block;
  padding: 6px 18px;
  background: var(--bg);
  color: var(--hazard);
  font-size: clamp(12px, 3vw, 14px);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.contact {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 22px;
}

.contact h2 {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.contact ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 22px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.contact a {
  color: var(--accent);
  font-size: 15px;
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.contact a:hover { border-bottom-color: var(--accent); }

.footnote {
  margin: 0;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
}

@media (max-width: 420px) {
  .skulls img { width: 64px; height: 64px; }
  .skulls img:nth-child(2) { width: 92px; height: 92px; }
}

@media (prefers-reduced-motion: reduce) {
  .skulls img:nth-child(1),
  .skulls img:nth-child(3) { display: none; }
}
</style>
</head>
<body>

<div class="skulls" aria-hidden="true">
  <img src="frienddemo/assets/goodskull.gif?v=14" alt="">
  <img src="frienddemo/assets/goodskull.gif?v=14" alt="">
  <img src="frienddemo/assets/goodskull.gif?v=14" alt="">
</div>

<h1>Mara's Abyss</h1>

<p class="tagline">
  An as of yet unlicensed game for <strong>Game Boy Color</strong> and
  <strong>ModRetro Chromatic</strong>.
</p>

<div class="construction">
  <span>Under construction</span>
</div>

<nav class="contact" aria-label="Project links">
  <h2>Follow</h2>
  <ul>
    <li><a href="https://www.indiedb.com/games/maras-abyss" target="_blank" rel="noopener">IndieDB</a></li>
    <li><a href="https://bsky.app/profile/ianatherton.bsky.social" target="_blank" rel="noopener">Bluesky</a></li>
    <li><a href="https://www.youtube.com/@Larkstead" target="_blank" rel="noopener">YouTube</a></li>
  </ul>
</nav>

<p class="footnote">More soon.</p>

</body>
</html>
